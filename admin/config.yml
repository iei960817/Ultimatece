backend:
  name: github
  repo: iei960817/Ultimatece
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_content"
    label: "全站内容管理（作品 / 加购清单 / 价格设置）"
    files:
      - name: "main_data"
        label: "网站主数据配置"
        file: "data.json"
        fields:
          - { label: "品牌主标题", name: "siteTitle", widget: "string", default: "ULTIMATE CREATION EVENT" }
          - { label: "首页副标题", name: "heroSubtitle", widget: "string", default: "3D 视觉还原 · 定制婚礼空间美学" }
          - { label: "无木底地毯单价 (RM/SQFT)", name: "carpetNoBasePrice", widget: "number", value_type: "float", default: 1.5 }
          - { label: "有木底地毯单价 (RM/SQFT)", name: "carpetWithBasePrice", widget: "number", value_type: "float", default: 4.0 }

          - label: "GMAIL 登录与 GOOGLE SHEETS 记录设置"
            name: "googleSettings"
            widget: "object"
            collapsed: true
            fields:
              - { label: "查看价格需要登录 GMAIL", name: "requireGmailForPrice", widget: "boolean", default: false }
              - { label: "GOOGLE OAUTH CLIENT ID", name: "googleClientId", widget: "string", required: false }
              - { label: "GOOGLE SHEETS 接收网址 (/EXEC)", name: "googleSheetsWebhook", widget: "string", required: false }

          - label: "作品展示（3D 效果图 & 实体图对比）"
            name: "works"
            widget: "list"
            summary: "{{fields.title}} ({{fields.size}} · {{fields.color}})"
            fields:
              - { label: "作品标题", name: "title", widget: "string" }
              - label: "背景尺寸"
                name: "size"
                widget: "select"
                options: ["16ft", "20ft", "24ft", "其他尺寸"]
                default: "20ft"
              - { label: "色系标签", name: "color", widget: "string", default: "白金色" }
              - { label: "3D 效果图", name: "renderImage", widget: "image" }
              - { label: "现场实体图", name: "actualImage", widget: "image" }
              - { label: "作品说明", name: "description", widget: "text", required: false }

          - label: "加购项目分类管理（可自由新增/排序/修改）"
            name: "addons"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - { label: "分类名称（如：ARCH 拱门、SPECIAL EFFECTS 特效）", name: "category", widget: "string" }
              - label: "该分类下的加购项目"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} - RM {{fields.price}}"
                fields:
                  - { label: "项目名称", name: "name", widget: "string" }
                  - label: "计价方式"
                    name: "pricingType"
                    widget: "select"
                    options:
                      - { label: "固定单价 (fixed)", value: "fixed" }
                      - { label: "多档位规格 (tiers)", value: "tiers" }
                      - { label: "按面积平方尺计算 (sqft)", value: "sqft" }
                      - { label: "需询问报价/尺寸参考 (inquiry)", value: "inquiry" }
                    default: "fixed"
                  - { label: "基础/起步价格 (RM)", name: "price", widget: "number", value_type: "float", default: 0 }
                  - { label: "附加必要费用 (如 T台保护费 RM300，无则填0)", name: "extraFee", widget: "number", value_type: "float", default: 0, required: false }
                  - { label: "最小长度限制 (ft，仅按面积计价使用)", name: "minLength", widget: "number", value_type: "int", default: 30, required: false }
                  - label: "可选宽度 (ft，仅按面积计价使用)"
                    name: "widthOptions"
                    widget: "list"
                    field: { label: "宽度(ft)", name: "width", widget: "number" }
                    required: false
                  - { label: "价格与规格简述", name: "unitNote", widget: "string", required: false }
                  - { label: "项目参考配图", name: "image", widget: "image", required: false }
                  - label: "可选子款式/颜色/配置（客户勾选时可单选）"
                    name: "options"
                    widget: "list"
                    field: { label: "选项描述", name: "option", widget: "string" }
                    required: false
                  - label: "多档位价格列表（仅当计价方式为 tiers 时填写）"
                    name: "tiers"
                    widget: "list"
                    summary: "{{fields.label}} - RM {{fields.price}}"
                    fields:
                      - { label: "档位名称（如：Standard 4粒）", name: "label", widget: "string" }
                      - { label: "档位价格 (RM)", name: "price", widget: "number", value_type: "float" }
                    required: false
                  - { label: "注意事项与说明", name: "notes", widget: "text", required: false }
